spring:
  datasource:
    url: jdbc:tc:postgresql:17.9-bookworm:///goal_tracker_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration_test
    
management:
  endpoints:
    web:
      exposure:
        include: health